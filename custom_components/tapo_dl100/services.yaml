probe_methods:
  name: Probe lock methods
  description: >-
    Calls a list of local DLKLAP methods on the lock and returns the raw
    responses. Use it to discover whether the lock exposes an event-log method.
  fields:
    entry_id:
      name: Lock
      description: Config entry of the lock to probe. Probes all loaded locks if omitted.
      required: false
      selector:
        config_entry:
          integration: tapo_dl100
    methods:
      name: Methods
      description: Method names to call. Defaults to known methods plus candidate event-log methods.
      required: false
      example: '["getComponentList", "getEventLog"]'
      selector:
        object:
